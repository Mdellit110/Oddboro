[package]
name = "oddboro"
version = "0.0.1"
description = "The Oddboro desktop shell: runs the office server and shows it in a window."
license = "Apache-2.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-updater = "=2.14.1"
serde_json = "=1.0.154"
libc = "=0.2.191"
mac-notification-sys = "=0.6.15"

[profile.release]
codegen-units = 1
lto = true
strip = true
