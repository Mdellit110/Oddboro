# Every merge to main builds a release of Oddboro for the Mac: the next patch
# version, signed, notarized and stapled, in a DRAFT release on the merge
# commit. The owner publishes it by hand. A draft is invisible to
# releases/latest, so installed apps update only after that. The secrets it
# needs, and how to make each, are in apps/desktop/CLAUDE.md.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# One at a time, so two merges never take the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Pick the version
        id: version
        run: |
          last=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[].tag_name' \
            | sed -n 's/^v\([0-9]*\.[0-9]*\.[0-9]*\)$/\1/p' \
            | sort -t. -k1,1n -k2,2n -k3,3n | tail -n 1)
          if [ -z "$last" ]; then
            next=0.0.1
          else
            IFS=. read -r major minor patch <<< "$last"
            next="$major.$minor.$((patch + 1))"
          fi
          echo "Building $next (the highest release so far: ${last:-none})"
          echo "version=$next" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-apple-darwin
          rustup default stable

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - run: npm ci --no-audit --no-fund

      - name: Import the Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/oddboro.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain"
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$keychain"
          # shellcheck disable=SC2046 # each keychain path is its own argument
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -n 1)
          if [ -z "$identity" ]; then
            echo "No Developer ID Application identity in APPLE_CERTIFICATE" >&2
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Write the release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="v$VERSION" -f target_commitish="$GITHUB_SHA" \
            --jq .body > "$RUNNER_TEMP/notes.md"

      - name: Build, sign and notarize
        env:
          VERSION: ${{ steps.version.outputs.version }}
          APPLE_API_KEY_CONTENTS: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_CONTENTS" > "$APPLE_API_KEY_PATH"
          unset APPLE_API_KEY_CONTENTS
          ODDBORO_RELEASE_NOTES="$(cat "$RUNNER_TEMP/notes.md")" \
          ODDBORO_RELEASE_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION" \
            node apps/desktop/scripts/release.ts --version "$VERSION"
          rm -f "$APPLE_API_KEY_PATH"

      - name: Draft the release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          out=apps/desktop/release
          gh release create "v$VERSION" --draft --target "$GITHUB_SHA" \
            --title "Oddboro $VERSION" --notes-file "$RUNNER_TEMP/notes.md" \
            "$out/Oddboro.dmg" \
            "$out/Oddboro_${VERSION}_aarch64.dmg" \
            "$out/Oddboro_${VERSION}_aarch64.app.tar.gz" \
            "$out/Oddboro_${VERSION}_aarch64.app.tar.gz.sig" \
            "$out/latest.json"

      - name: Remove the keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/oddboro.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/cert.p12"
